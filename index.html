<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>쥬베라 AS 업무판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 배치: 맨 위=큰 분류(일반 AS / 현대홈쇼핑), 그 아래 화면 탭, 왼쪽=접수 건 카드(단계·막힌 곳·최근 이력), 오른쪽=선택한 건의 탭 */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#18212f; --sub:#5b6778; --line:#d9dfe8; --soft:#eaeef4;
  --accent:#1f4fd8; --accent-ink:#ffffff; --accent-soft:#e4ebfd;
  --red:#c5221f; --red-soft:#fde9e7; --amber:#8a5a00; --amber-soft:#fdf1d3; --green:#1a7a45; --green-soft:#dff3e7;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151c; --panel:#1a202a; --ink:#e8ecf2; --sub:#9aa6b8; --line:#2f3847; --soft:#232b38;
  --accent:#7ea2ff; --accent-ink:#0d1422; --accent-soft:#1f2c4d;
  --red:#ff8a80; --red-soft:#47201e; --amber:#f2c261; --amber-soft:#3d3015; --green:#6fd39a; --green-soft:#173524; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151c; --panel:#1a202a; --ink:#e8ecf2; --sub:#9aa6b8; --line:#2f3847; --soft:#232b38;
  --accent:#7ea2ff; --accent-ink:#0d1422; --accent-soft:#1f2c4d;
  --red:#ff8a80; --red-soft:#47201e; --amber:#f2c261; --amber-soft:#3d3015; --green:#6fd39a; --green-soft:#173524; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{overflow-x:hidden;overflow-x:clip;max-width:100%}
.wrap,.work,.list,.row,.detail,.doc{max-width:100%}
.tw{max-width:100%;-webkit-overflow-scrolling:touch}
/* 아이폰 사파리는 16px보다 작은 입력칸을 누르면 화면을 확대해 좌우로 밀린다 */
@media (max-width:900px){input,select,textarea{font-size:16px!important}}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 60px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-size:20px;margin:0;font-weight:700}
h2{font-size:17px;margin:0 0 8px;font-weight:700;text-wrap:balance}
h3{font-size:14px;margin:0 0 6px;font-weight:700;color:var(--sub)}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.proto{font-size:12.5px;color:var(--amber);background:var(--amber-soft);padding:3px 9px;border-radius:4px;font-weight:600}
.proto.live{color:var(--green);background:var(--green-soft)}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:6px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.me{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--sub)}
select,input[type=text],input[type=date],textarea{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 9px;min-width:0}
textarea{width:100%;resize:vertical}

.cats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cats button{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:16px 18px;text-align:left;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.cats button b{font-size:30px;line-height:1.25;font-weight:700}
.cats button span{font-size:15px;color:var(--sub);font-weight:600}
.cats button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cats button[aria-pressed="true"] span{color:var(--accent-ink)}
@media (max-width:560px){.cats{gap:6px}.cats button{padding:10px 8px;gap:2px 8px}.cats button b{font-size:19px}.cats button span{font-size:13px}}

.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
.strip button{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:1px}
.strip button b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.strip button span{font-size:13px;color:var(--sub);font-weight:500}
.strip button em{font-style:normal;font-size:11.5px;color:var(--sub)}
.strip button.hot b{color:var(--red)}
.mic{padding:6px 10px;min-width:40px}.mic.on{background:var(--red);color:#fff;border-color:var(--red)}
#syncBar{margin-top:8px;font-size:13px;color:var(--sub)}#syncBar.warn{color:var(--red);font-weight:600;cursor:pointer}
.strip .moreBtn{display:none}
@media (max-width:700px){
  .strip{grid-template-columns:repeat(3,1fr);gap:6px}
  .strip button{padding:7px 8px}
  .strip button b{font-size:18px}
  .strip button span{font-size:12px;line-height:1.25}
  .strip button em{display:none}
  .strip button.z{display:none}
  .strip:not(.open) button.more:not([aria-pressed="true"]){display:none}
  .strip .moreBtn{display:flex;justify-content:center;align-items:center;color:var(--sub)}
}
.strip button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar input[type=text]{flex:1 1 220px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:7px 12px;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}

.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,470px);gap:14px;align-items:start}
.list{display:flex;flex-direction:column;gap:8px;min-width:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;text-align:left;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:11px 12px;cursor:pointer}
.row.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.row.urgent{border-color:var(--red)}
.row>.full{grid-column:1/-1;min-width:0}
.path{display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center;font-size:14px;min-width:0}
.path i{font-style:normal;color:var(--sub)}
.path .todo{font-weight:700;font-size:17px}
.row.urgent .todo{color:var(--red)}
.when{font-weight:700;font-variant-numeric:tabular-nums}
.who{font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);white-space:nowrap;align-self:center}
.who.c{background:var(--accent-soft);color:var(--accent)}
.who.w{background:var(--green-soft);color:var(--green)}
.who.a{background:var(--amber-soft);color:var(--amber)}
.meta{font-size:13.5px;color:var(--sub);overflow-wrap:anywhere}
.meta b{color:var(--ink);font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.last{font-size:13px;color:var(--sub);border-top:1px dashed var(--line);padding-top:6px;overflow-wrap:anywhere}
.last b{color:var(--ink);font-weight:500}
.pri,.kind{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:4px;margin-right:4px}
.pri.P1{background:var(--red);color:var(--panel)}.pri.P2{background:var(--red-soft);color:var(--red)}.pri.P3{background:var(--soft);color:var(--ink)}.pri.P4{background:var(--soft);color:var(--sub)}
.kind{background:var(--accent-soft);color:var(--accent)}
.empty{padding:28px;text-align:center;color:var(--sub);border:1px dashed var(--line);border-radius:8px}
.trk,.pk{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:4px}
.trk{background:var(--accent-soft);color:var(--accent)}
.trk.bad{background:var(--red);color:var(--panel)}
.trk.ok{background:var(--green-soft);color:var(--green)}
.pk{background:var(--soft);color:var(--ink)}
.pk.late{background:var(--amber-soft);color:var(--amber)}
/* 단계 띠: 지나간 단계=초록, 지금 단계=파랑, 막힌 단계=빨강 */
.steps{display:flex;gap:3px;flex-wrap:wrap;font-size:12px}
.steps span{padding:4px 7px;border-radius:4px;background:var(--soft);color:var(--sub)}
.steps span.past{background:var(--green-soft);color:var(--green)}
.steps span.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.steps span.stuck{background:var(--red);color:var(--panel);font-weight:700}
.steps span.waitc{background:var(--amber-soft);color:var(--amber);font-weight:700}

.detail{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);max-height:calc(100vh - 20px);overflow:auto;min-width:0}
.dhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.dhead small{color:var(--sub);font-variant-numeric:tabular-nums}
.close{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px}
.dtabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--line);padding-bottom:6px}
.dtabs button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 11px;font-weight:600;font-size:14px}
.dtabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dpane{display:flex;flex-direction:column;gap:14px}
.next{border-radius:8px;padding:12px;background:var(--accent-soft);display:flex;flex-direction:column;gap:9px}
.next.urgent{background:var(--red-soft)}
.next .lab{font-size:12.5px;color:var(--sub);font-weight:600}
.next .big{font-size:18px;font-weight:700}
.next p{margin:0;font-size:14px}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:8px 13px;font-weight:600}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--line);font-weight:500}
.btn.sm{padding:3px 9px;font-size:12.5px}
.field{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--sub)}
.field input,.field select{width:100%}
dl{display:grid;grid-template-columns:92px minmax(0,1fr);gap:5px 10px;margin:0;font-size:14px}
dt{color:var(--sub)}dd{margin:0;overflow-wrap:anywhere}
.tag{font-size:12px;font-weight:700;padding:1px 7px;border-radius:4px}
.tag.free{background:var(--green-soft);color:var(--green)}
.tag.paid{background:var(--amber-soft);color:var(--amber)}
.tag.no{background:var(--red-soft);color:var(--red)}
.msg{white-space:pre-wrap;background:var(--soft);border-radius:6px;padding:10px;font-size:13.5px;margin:0;font-family:var(--font)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.hist li{font-size:13.5px;border-left:2px solid var(--line);padding-left:9px;display:flex;flex-direction:column;gap:3px}
.hist small{color:var(--sub);font-variant-numeric:tabular-nums}
.hist .hrow{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.hist .hrow span{overflow-wrap:anywhere;min-width:0}
.memo{display:flex;gap:6px}.memo input{flex:1}
.live{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.live .lab{font-size:12.5px;color:var(--sub);font-weight:600}
.live .big{font-size:17px;font-weight:700}
.live.bad .big{color:var(--red)}
.live p{margin:0;font-size:13.5px;color:var(--sub)}
.live p b{color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:5px}
.gsteps,.tsteps{display:grid;gap:3px;font-size:12px;text-align:center}
.gsteps{grid-template-columns:repeat(6,minmax(0,1fr))}
.tsteps{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:8px}
.gsteps span,.tsteps span{padding:5px 2px;border-radius:4px;background:var(--soft);color:var(--sub)}
.gsteps span.past,.tsteps span.past{background:var(--green-soft);color:var(--green)}
.gsteps span.on,.tsteps span.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.gsteps span.bad,.tsteps span.bad{background:var(--red);color:var(--panel);font-weight:700}
@media (max-width:480px){.gsteps{grid-template-columns:repeat(3,minmax(0,1fr))}}
a{color:var(--accent)}
.go{border:0;background:none;color:var(--accent);font-weight:600;padding:0;text-decoration:underline}

.doc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:22px}
.doc p,.doc li{max-width:68ch}
.doc p{margin:0 0 6px}.doc ul,.doc ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{color:var(--sub);font-size:12.5px;white-space:nowrap}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kpi div{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--sub)}
.st{font-weight:700}.st.off{color:var(--red)}.st.plan{color:var(--amber)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:900px){
  .work{grid-template-columns:minmax(0,1fr)}
  .detail{position:fixed;inset:0;z-index:20;border-radius:0;max-height:none;
    padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
</style>

<div class="wrap">
  <div class="top">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <h1>쥬베라 AS 업무판</h1><span class="proto" id="badge">설계 초안 · 예시 자료 · 저장되지 않음</span>
    </div>
    <label class="me" id="meBox">지금 쓰는 사람
      <select id="me"><option value="상담">김은진 (상담)</option><option value="창고">최미영 실장 (창고)</option><option value="대표">대표</option></select>
    </label>
    <span class="me" id="meLive" hidden></span>
  </div>
  <div class="cats" id="catSeg"></div>
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-v="todo" aria-selected="true">할 일</button>
    <button role="tab" data-v="trk" aria-selected="false">송장 추적</button>
    <button role="tab" data-v="new" aria-selected="false">새 접수</button>
    <button role="tab" data-v="boss" aria-selected="false">총괄</button>
    <button role="tab" data-v="rep" aria-selected="false">보고함</button>
    <button role="tab" data-v="plan" aria-selected="false">설계 설명</button>
  </div>

  <section id="v-todo">
    <div style="display:flex;flex-direction:column;gap:10px">
      <div class="strip" id="strip"></div>
      <div id="syncBar" hidden></div>
      <div class="bar">
        <div class="seg" id="ownerSeg">
          <button data-o="all" aria-pressed="true">모든 현황</button><button data-o="상담" aria-pressed="false">김은진(상담)</button><button data-o="창고" aria-pressed="false">최미영 실장(창고)</button>
        </div>
        <input type="text" id="q" placeholder="이름·연락처 뒷자리·접수번호·송장번호 검색 (완료 건 포함)">
        <label class="btn" for="q-shot" style="cursor:pointer;white-space:nowrap">📷 송장으로 건 찾기</label><input type="file" id="q-shot" accept="image/*" capture="environment" hidden>
      </div>
      <div class="work">
        <div class="list" id="list"></div>
        <aside class="detail" id="detail" hidden></aside>
      </div>
    </div>
  </section>
  <section id="v-trk" hidden></section>
  <section id="v-new" hidden></section>
  <section id="v-boss" hidden></section>
  <section id="v-rep" hidden></section>
  <section id="v-plan" hidden></section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* 실제 운영(구글 로그인)에서는 google.script.run 이 있고, 견본 화면에서는 없다 */
const LIVE=!!(window.google&&google.script&&google.script.run);
const SAMPLE_NOW=new Date('2026-11-17T14:00:00');
const SNAP=window.AS_SNAPSHOT||null; // 시트 수집본(보기용)
const NOW=()=>LIVE?new Date():SNAP?new Date(SNAP.at.replace(' ','T')):SAMPLE_NOW;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const p2=n=>String(n).padStart(2,'0');
const pd=s=>new Date(String(s).replace(' ','T'));                 // 'YYYY-MM-DD HH:MM' → 날짜
const iso=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const ts=()=>{const d=new Date();return iso(d)+' '+p2(d.getHours())+':'+p2(d.getMinutes())};
const md=s=>{const d=pd(s);return (d.getMonth()+1)+'/'+d.getDate()};
const sh=s=>{const d=pd(s);return md(s)+(String(s).length>10?' '+p2(d.getHours())+':'+p2(d.getMinutes()):'')};
const day0=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const gap=(a,b)=>Math.round((day0(pd(b))-day0(pd(a)))/864e5);    // a에서 b까지 날짜 수
const days=s=>Math.round((day0(NOW())-day0(pd(s)))/864e5);        // 오늘까지 날짜 수
const won=n=>n?n.toLocaleString('ko-KR')+'원':'0원';

/* 'AS 비용' 탭 기준: [1~2년, 2년 이후] */
const FEE={'신형뷰러':[19000,19000],'구형뷰러':[15000,15000],'프리미엄 플러스':[45000,60000],'트라이':[50000,65000],'트리플':[55000,80000],'베이직 미니':[30000,30000],'듀얼 딥웨이브':[90000,90000],'베라건':[29000,29000],'피지흡입기':[25000,25000],'기타':[0,0]};
const BLOCKED={'신형뷰러':'유상 AS 접수 불가 (공장 일정, 2027년 1월 재개)'};

   :`<div class="empty">${q?'검색 결과가 없습니다.':'이 칸에는 지금 할 일이 없습니다.'}</div>`;
}

const RET_FORM=`<p><b>반품</b> 건입니다. 창고 입고 후 개봉/미개봉을 확인하고, 파트너시스템에서 회수확정한 뒤 종료하세요. 출고는 없습니다.</p><label class="field">제품 상태<select id="f-open"><option>미개봉</option><option>개봉 · 이상 없음</option><option>개봉 · 사용 흔적/훼손</option></select></label><label class="field">메모 (선택)<input type="text" id="f-note" placeholder="예: 구성품 모두 있음"></label>`;

    <div class="acts" ${SAMPLE_OK===false?'hidden':''}><label class="btn ghost" for="f-shot" style="cursor:pointer">📷 송장 사진으로 번호 넣기</label><input type="file" id="f-shot" accept="image/*" capture="environment" hidden></div>

function nextBox(c){

      :`<button class="btn" data-a="toPickup">맞음 → 수거로 진행</button><button class="btn ghost" data-a="selfShip">고객이 직접 발송</button>`;
    acts+=`<button class="btn ghost" data-a="hold">보류</button>`;

    body=`<p>롯데택배 수거를 접수하고 회수 송장번호를 넣어 주세요. 저장하면 수거 안내 문자가 '안내문' 탭에 준비됩니다.</p><label class="field">회수 송장번호<input type="text" id="f-in" placeholder="예: 2645-0000-0000"></label>`;
    acts=`<button class="btn" data-a="pickupDone">수거 접수 완료</button>`;
  } else if(c.stage==='transit'){
    const picked=c.tin.some(e=>e.k==='picked');
    body=`<p>${c.method==='고객발송'?'고객이 선불로 보내는 중입니다.':'택배 이동을 기다립니다. 수거 실패, 3일째 수거 안 됨, 48시간 이동 없음이면 빨갛게 올라옵니다.'} 택배 자동 조회가 붙기 전까지는 아래 버튼으로 표시합니다.</p>`;

    const rt=ctypeOf(c)==='반품';
    body=`<p>${rt?'<b>반품</b> 건입니다. 이상이 없으면 회수 완료로 끝내고, 문제가 있으면 결과를 골라 상담에게 넘깁니다.':'상자를 열어 확인한 결과를 고르세요.'}</p><label class="field">검사 결과<select id="f-sym">${(rt?['반품 제품 이상 없음',...SYMPTOMS.filter(x=>x!=='반품 제품 이상 없음')]:SYMPTOMS).map(s=>`<option>${s}</option>`).join('')}</select></label><label class="field">창고 메모 · 기타 내용 (기타를 고르면 꼭 적어 주세요)<input type="text" id="f-note" placeholder="예: 충전선 없이 본품만 옴 / 반품 제품 박스 훼손"></label>`;

  } else if(c.stage==='notify'&&catOf(c)==='hs'&&ctypeOf(c)==='반품'){
    body=RET_FORM; acts=`<button class="btn" data-a="returnClose">회수확정 → 반품 종료</button><button class="btn ghost" data-a="hold">보류</button>`;
  } else if(c.stage==='notify'){
    const p=c.plan, u=dueInfo(c);

    acts=(p==='rtcheck'?`<button class="btn" data-a="returnClose">고객 안내 완료 → 반품 종료</button>`:`<button class="btn" data-a="notifyDone">고객 안내 완료</button>`)+`<button class="btn ghost" data-a="hold">고객 연락 안 됨 → 보류</button>`+(p==='paid'?`<button class="btn ghost" data-a="nopayClose">진행 안 함 → 종료</button>`:'');

function msgFor(c){
  if(c.draft) return ['답변 초안 (보내기 전 확인)',c.draft];
  const w=warranty(c);
  if(c.stage==='judge'&&w.k==='paid'&&BLOCKED[c.fam]) return ['유상 AS 접수 불가 안내',TPL.blocked(c)];
  if(c.stage==='pickup'||c.stage==='transit') return ['수거 안내',TPL.pickup(c)];
  if(c.stage==='notify'&&c.plan==='rtcheck') return ['반품 확인 결과 안내',`안녕하세요 고객님, 쥬베라입니다.\n보내 주신 반품 제품을 확인했습니다.\n\n■ 확인 결과: ${c.inspect}\n\n처리 방법은 담당자가 다시 안내드리겠습니다.`];
  if(c.stage==='notify'||c.stage==='pay') return c.plan==='normal'?['정상작동 안내',TPL.normal(c)]:c.plan==='free'?['무상 교환 안내',TPL.free(c)]:['유상 비용 안내',TPL.paid(c,w.fee)];
  if(c.stage==='ship'||c.stage==='done') return ['출고 안내',TPL.out(c)];
  return null;
}

function repeats(){
  const m={}; cases.filter(c=>days(c.recv)<=60&&c.inflow!=='자사몰 게시판').forEach(c=>{const k=triage(c).kind; if(k==='반품(변심)'||k==='기타') return; const key=(c.fam||'기타')+' · '+k; (m[key]=m[key]||{n:0,open:0,fam:c.fam,kind:k}).n++; if(!ST[c.stage].end) m[key].open++});
  return Object.entries(m).sort((a,b)=>b[1].n-a[1].n);

  if(!hit.length&&p4.length===4){hit=cases.filter(c=>dg(c.phone).endsWith(p4));how='전화번호 끝자리'}
  if(hit.length>1&&nm){const h2=hit.filter(c=>String(c.name||'').replace(/\s/g,'').includes(nm.slice(0,2)));if(h2.length)hit=h2}
  if(!hit.length&&nm.length>=2){hit=cases.filter(c=>String(c.name||'').replace(/\s/g,'')===nm);how='이름'}
  const open=hit.filter(c=>!ST[c.stage].end); if(open.length) hit=open;
  if(!hit.length){ q=nums[0]||''; $('q').value=q; renderStrip(); renderList(); return toast('맞는 건을 찾지 못했습니다'+(nums[0]?' (송장 '+nums[0]+')':'')+'. 새 접수로 등록하거나 직접 검색해 주세요.') }
  if(hit.length===1){ const c=hit[0]; cat=catOf(c); q=''; $('q').value=''; filt='todo'; sel=c.id; dtab='do'; editH=-1; editInfo=false; show('todo'); sel=c.id; renderDetail(); return toast(how+'로 찾았습니다 → '+c.name+' · '+task(c).todo) }
  cat=catOf(hit[0]); q=hit.map(c=>c.id).join(' '); filt='todo'; sel=null; show('todo');
  renderListOf(hit); toast(how+'로 '+hit.length+'건이 맞습니다. 하나를 골라 주세요');
}
function renderListOf(arr){ const keep=visible; visible=()=>arr; renderList(); visible=keep }

/* 음성으로 메모 넣기 (컴퓨터 크롬·클로드 앱). 아이폰은 키보드 마이크를 쓴다. */
let DICT=null, MIC_T=null;
const MIC_IDS=['f-memo','f-memo2','f-note','n-raw'];
function addMics(){ if(!DICT) return; MIC_IDS.forEach(id=>{const el=document.getElementById(id); if(!el||el.dataset.mic) return; el.dataset.mic='1';
  const b=document.createElement('button'); b.type='button'; b.className='btn ghost mic'; b.dataset.micFor=id; b.title='말로 입력'; b.textContent='🎤';
  el.insertAdjacentElement('afterend',b) }) }
(async()=>{ try{ if(!window.claude||!window.claude.use) return; const d=await window.claude.use('dictation'); if(!d) return; DICT=d;
  d.onFinal(({text})=>{ const el=MIC_T&&document.getElementById(MIC_T); if(el&&text){ el.value=(el.value?el.value.replace(/\s*$/,' '):'')+text.trim(); el.dispatchEvent(new Event('input',{bubbles:true})) } });
  d.onState(({state})=>{ document.querySelectorAll('.mic').forEach(b=>{const on=state==='listening'&&b.dataset.micFor===MIC_T; b.classList.toggle('on',on); b.textContent=on?'⏹':'🎤'}) });
  addMics(); new MutationObserver(addMics).observe(document.body,{childList:true,subtree:true});
 }catch(e){} })();
document.addEventListener('click',e=>{ const b=e.target.closest('.mic'); if(!b||!DICT) return; e.preventDefault(); e.stopPropagation();
  if(b.classList.contains('on')){ DICT.stop().catch(()=>{}); return }
  MIC_T=b.dataset.micFor; DICT.start().catch(err=>{ if(err&&err.code==='not_granted'){ DICT=null; document.querySelectorAll('.mic').forEach(x=>x.remove()); toast('마이크를 허용하지 않아 음성 입력을 숨겼습니다') } }) },true);
/* 시트 반영 상태: AS 창이 시트에 옮기고 남긴 결과. 못 넣은 건과 시트에 두 줄 있는 건을 빨갛게 알려 준다. */
let SYNC=null;
function syncWarn(c){ if(!SYNC) return ''; const s=(SYNC.skipped||[]).find(x=>x.id===c.id); if(s) return '시트에 못 넣음 · '+s.why; const d=(SYNC.dupes||[]).find(x=>x.id===c.id); if(d) return '시트에 같은 건이 두 줄 · '+d.keep+'에 반영, '+d.drop+'은 정리 필요'; return '' }
function renderSync(){ const el=$('syncBar'); if(!el) return; if(!SYNC){el.hidden=true;return}
  const n=(SYNC.skipped||[]).length, m=(SYNC.dupes||[]).length; el.hidden=false; el.className=n||m?'warn':'';
  el.textContent='시트 반영 '+(SYNC.at||'')+(SYNC.wrote?' · 이번에 '+SYNC.wrote+'줄':'')+(n?' · ⚠ 시트에 못 넣은 건 '+n:'')+(m?' · ⚠ 시트에 두 줄인 건 '+m:'')+(n||m?' (눌러서 보기)':' · 모두 반영됨') }
const saving=new Map(); // 건마다 저장을 한 번에 하나씩 보낸다 (연달아 눌러도 순서가 꼬이지 않게)
function persist(c){
  if(!LIVE){dbSave(c);return}
  if(saving.get(c)){saving.set(c,'again');return}
  saving.set(c,'now');
  const wasNew=String(c.id).startsWith('NEW-'), tmp=c.id;
  google.script.run.withSuccessHandler(r=>{c.rev=r.rev; if(wasNew){c.id=r.id; if(sel===tmp) sel=r.id; refresh()}
      const again=saving.get(c)==='again'; saving.delete(c); if(again) persist(c)})
    .withFailureHandler(e=>{saving.clear(); toast('저장하지 못했습니다: '+(e&&e.message||e)+' · 최신 자료를 다시 불러옵니다'); reload()})
    .saveCase(JSON.stringify(c));
}
function reload(){
  if(!LIVE||saving.size) return;
  google.script.run.withSuccessHandler(list=>{cases=list.map(s=>C(JSON.parse(s)));
    const busy=document.activeElement&&$('detail').contains(document.activeElement)&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
    renderStrip();renderList(); if(!busy) renderDetail(); if(!$('v-boss').hidden)renderBoss(); if(!$('v-trk').hidden)renderTrk()}).getCases();
}
function boot(){
  if(SNAP){$('badge').textContent='시트 수집본 · '+sh(SNAP.at)+' 기준 · 공유 저장소 연결 중…';$('meBox').hidden=true}
  if(!LIVE) initShared();
  if(!LIVE){renderNew();refresh(); if(window.matchMedia('(min-width:901px)').matches){sel=visible()[0]?.id||null;refresh()} return}
  $('badge').textContent='자료를 불러오는 중…';
  $('meBox').hidden=true; document.querySelector('#tabs [data-v="plan"]').hidden=true;
  google.script.run.withSuccessHandler(r=>{
    USER=r.user; SETTINGS=r.settings||SETTINGS; if(r.roleNames) ROLE_NAME=Object.assign(ROLE_NAME,r.roleNames);
    cases=r.cases.map(s=>C(JSON.parse(s)));
    $('badge').textContent='실제 자료 · 누르면 바로 저장'; $('badge').className='proto live';
    $('meLive').hidden=false; $('meLive').textContent=USER.name+' ('+USER.role+') · '+USER.email;
    document.querySelectorAll('#ownerSeg button').forEach(b=>{if(b.dataset.o!=='all') b.textContent=disp(b.dataset.o)+'('+b.dataset.o+')'});
    renderNew(); refresh(); setInterval(reload,60000);
  }).withFailureHandler(e=>{document.querySelector('.wrap').innerHTML='<div class="doc"><h2>들어올 수 없습니다</h2><p>'+esc(e&&e.message||e)+'</p><p>대표님께 구글 계정 등록을 요청해 주세요.</p></div>'}).boot();
}

/* ---------- 화면 전환·이벤트 ---------- */
function show(v){['todo','trk','new','boss','rep','plan'].forEach(k=>$('v-'+k).hidden=k!==v); if(v==='rep')renderRep();
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));
  if(v==='trk')renderTrk(); if(v==='boss')renderBoss(); if(v==='todo')refresh()}
function openCase(id){sel=id;dtab='do';editH=-1;editInfo=false;q=id;$('q').value=id;show('todo')}
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.v)};
$('catSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c;filt='todo';q='';$('q').value='';sel=null;show('todo')};
$('strip').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.more){$('strip').classList.toggle('open');renderStrip();return}filt=b.dataset.f;q='';$('q').value='';refresh()};
$('ownerSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;owner=b.dataset.o;document.querySelectorAll('#ownerSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b));refresh()};
$('q').oninput=e=>{q=e.target.value.trim();renderStrip();renderList()};
const pick=r=>{sel=r.dataset.id;dtab='do';editH=-1;editInfo=false;refresh()};
$('list').onclick=e=>{const r=e.target.closest('.row');if(r)pick(r)};
$('list').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){const r=e.target.closest('.row');if(r){e.preventDefault();pick(r)}}};
$('syncBar').onclick=()=>{ if(!SYNC) return; const ids=[...(SYNC.skipped||[]),...(SYNC.dupes||[])].map(x=>x.id); if(!ids.length) return; const arr=cases.filter(c=>ids.includes(c.id)); if(!arr.length) return toast('해당 건이 이 화면에 없습니다'); cat=catOf(arr[0]); filt='todo'; sel=null; show('todo'); renderListOf(arr); toast('시트에 반영되지 않은 건 '+arr.length+'건') };
$('q-shot').onchange=e=>{ if(e.target.files&&e.target.files[0]){ findByWaybill(e.target.files[0]); e.target.value='' } };
$('detail').onchange=e=>{ if(e.target&&e.target.id==='f-shot'&&e.target.files&&e.target.files[0]){ readWaybill(e.target.files[0]); e.target.value='' } };
$('detail').onclick=e=>{const t=e.target.closest('[data-dt]');if(t){dtab=t.dataset.dt;editH=-1;editInfo=false;return renderDetail()}const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b)};
$('v-trk').onclick=e=>{const b=e.target.closest('[data-go]');if(b)openCase(b.dataset.go)};
$('v-boss').onclick=e=>{const b=e.target.closest('[data-go]');if(b)openCase(b.dataset.go)};
boot();
</script>
