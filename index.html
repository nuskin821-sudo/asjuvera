<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>쥬베라 AS 업무판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 배치: 위=할 일 종류별 건수 띠, 왼쪽=할 일 목록(한 줄 한 건), 오른쪽=선택한 건의 전체 자료와 다음 행동 버튼 */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#18212f; --sub:#5b6778; --line:#d9dfe8; --soft:#eaeef4;
  --accent:#1f4fd8; --accent-ink:#ffffff; --accent-soft:#e4ebfd;
  --red:#c5221f; --red-soft:#fde9e7; --amber:#8a5a00; --amber-soft:#fdf1d3; --green:#1a7a45; --green-soft:#dff3e7;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151c; --panel:#1a202a; --ink:#e8ecf2; --sub:#9aa6b8; --line:#2f3847; --soft:#232b38;
  --accent:#7ea2ff; --accent-ink:#0d1422; --accent-soft:#1f2c4d;
  --red:#ff8a80; --red-soft:#47201e; --amber:#f2c261; --amber-soft:#3d3015; --green:#6fd39a; --green-soft:#173524; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151c; --panel:#1a202a; --ink:#e8ecf2; --sub:#9aa6b8; --line:#2f3847; --soft:#232b38;
  --accent:#7ea2ff; --accent-ink:#0d1422; --accent-soft:#1f2c4d;
  --red:#ff8a80; --red-soft:#47201e; --amber:#f2c261; --amber-soft:#3d3015; --green:#6fd39a; --green-soft:#173524; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 60px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1{font-size:20px;margin:0;font-weight:700}
h2{font-size:17px;margin:0 0 8px;font-weight:700;text-wrap:balance}
h3{font-size:14px;margin:0 0 6px;font-weight:700;color:var(--sub)}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.proto{font-size:12.5px;color:var(--amber);background:var(--amber-soft);padding:3px 9px;border-radius:4px;font-weight:600}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:6px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.me{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--sub)}
select,input[type=text],input[type=date],textarea{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 9px;min-width:0}
textarea{width:100%;resize:vertical}

/* 할 일 띠 */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
.strip button{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:1px}
.strip button b{font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.strip button span{font-size:13px;color:var(--sub);font-weight:500}
.strip button em{font-style:normal;font-size:11.5px;color:var(--sub)}
.strip button.hot b{color:var(--red)}
.strip button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar input[type=text]{flex:1 1 220px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:7px 12px;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}

.work{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,460px);gap:14px;align-items:start}
.list{display:flex;flex-direction:column;gap:6px;min-width:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;text-align:left;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 12px}
.row.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.row.urgent{background:var(--red-soft);border-color:var(--red)}
.path{display:flex;flex-wrap:wrap;gap:2px 6px;align-items:center;font-size:14px;min-width:0}
.path i{font-style:normal;color:var(--sub)}
.path .todo{font-weight:700;font-size:15px}
.row.urgent .todo{color:var(--red)}
.who{font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);white-space:nowrap;align-self:center}
.who.c{background:var(--accent-soft);color:var(--accent)}
.who.w{background:var(--green-soft);color:var(--green)}
.who.a{background:var(--amber-soft);color:var(--amber)}
.meta{grid-column:1/-1;font-size:13px;color:var(--sub);overflow-wrap:anywhere}
.meta b{color:var(--ink);font-weight:500}
.trk{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent);margin-right:4px}
.trk.bad{background:var(--red);color:var(--panel)}
.trk.ok{background:var(--green-soft);color:var(--green)}
.tsteps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;margin-bottom:8px;font-size:12.5px;text-align:center}
.tsteps span{padding:5px 2px;border-radius:4px;background:var(--soft);color:var(--sub)}
.tsteps span.past{background:var(--green-soft);color:var(--green)}
.tsteps span.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.tsteps span.bad{background:var(--red);color:var(--panel);font-weight:700}
.pk{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:4px;background:var(--soft);color:var(--ink);margin-right:4px}
.pk.late{background:var(--amber-soft);color:var(--amber)}
.when{font-weight:700;font-variant-numeric:tabular-nums}
.live{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.live .lab{font-size:12.5px;color:var(--sub);font-weight:600}
.live .big{font-size:17px;font-weight:700}
.live.bad .big{color:var(--red)}
.live p{margin:0;font-size:13.5px;color:var(--sub)}
.live p b{color:var(--ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:5px}
.gsteps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;font-size:12px;text-align:center}
.gsteps span{padding:5px 2px;border-radius:4px;background:var(--soft);color:var(--sub)}
.gsteps span.past{background:var(--green-soft);color:var(--green)}
.gsteps span.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.gsteps span.bad{background:var(--red);color:var(--panel);font-weight:700}
@media (max-width:480px){.gsteps{grid-template-columns:repeat(3,minmax(0,1fr))}}
.dtabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--line);padding-bottom:6px}
.dtabs button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px 11px;font-weight:600;font-size:14px}
.dtabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dpane{display:flex;flex-direction:column;gap:14px}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cats button{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:16px 18px;text-align:left;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.cats button b{font-size:30px;line-height:1.25;font-weight:700}
.cats button span{font-size:15px;color:var(--sub);font-weight:600}
.cats button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cats button[aria-pressed="true"] span{color:var(--accent-ink)}
@media (max-width:560px){.cats button{padding:12px}.cats button b{font-size:22px}}
.go{border:0;background:none;color:var(--accent);font-weight:600;padding:0;text-decoration:underline}
.empty{padding:28px;text-align:center;color:var(--sub);border:1px dashed var(--line);border-radius:8px}

/* 상세 */
.detail{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);max-height:calc(100vh - 20px);overflow:auto;min-width:0}
.dhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.dhead small{color:var(--sub);font-variant-numeric:tabular-nums}
.close{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px}
.next{border-radius:8px;padding:12px;background:var(--accent-soft);display:flex;flex-direction:column;gap:9px}
.next.urgent{background:var(--red-soft)}
.next .lab{font-size:12.5px;color:var(--sub);font-weight:600}
.next .big{font-size:18px;font-weight:700}
.next p{margin:0;font-size:14px}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:8px 13px;font-weight:600}
.btn.ghost{background:var(--panel);color:var(--ink);border-color:var(--line);font-weight:500}
.field{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--sub)}
.field input,.field select{width:100%}
.steps{display:flex;gap:3px;flex-wrap:wrap;font-size:12px}
.steps span{padding:3px 7px;border-radius:4px;background:var(--soft);color:var(--sub)}
.steps span.on{background:var(--ink);color:var(--bg);font-weight:600}
.steps span.past{background:var(--green-soft);color:var(--green)}
dl{display:grid;grid-template-columns:92px minmax(0,1fr);gap:5px 10px;margin:0;font-size:14px}
dt{color:var(--sub)}dd{margin:0;overflow-wrap:anywhere}
.tag{font-size:12px;font-weight:700;padding:1px 7px;border-radius:4px}
.tag.free{background:var(--green-soft);color:var(--green)}
.tag.paid{background:var(--amber-soft);color:var(--amber)}
.tag.no{background:var(--red-soft);color:var(--red)}
.msg{white-space:pre-wrap;background:var(--soft);border-radius:6px;padding:10px;font-size:13.5px;margin:0;font-family:var(--font)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.hist li{font-size:13.5px;border-left:2px solid var(--line);padding-left:9px}
.hist small{color:var(--sub);display:block;font-variant-numeric:tabular-nums}
.memo{display:flex;gap:6px}.memo input{flex:1}

/* 문서형 화면 */
.doc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:22px}
.doc p,.doc li{max-width:68ch}
.doc p{margin:0 0 6px}.doc ul,.doc ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{color:var(--sub);font-size:12.5px;white-space:nowrap}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:8px;padding:12px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kpi div{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--sub)}
.st{font-weight:700}.st.off{color:var(--red)}.st.plan{color:var(--amber)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:900px){
  .work{grid-template-columns:minmax(0,1fr)}
  .detail{position:fixed;inset:0;z-index:20;border-radius:0;max-height:none;
    padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
</style>

  <div class="top">

<script>

const TSTEP={book:0,fail:0,picked:1,move:2,arrived:3};
const TLAB={in:['수거 예약','수거 완료','이동 중','창고 도착'],out:['출고 접수','집화 완료','이동 중','고객 수령']};
function trk(c,dir){ // dir 없으면 지금 움직이는 쪽
  dir=dir||(c.tout.length?'out':c.tin.length?'in':null); if(!dir) return null;
  const e=dir==='out'?c.tout:c.tin; if(!e.length) return null; const last=e[e.length-1];
  return {dir,e,last,step:TSTEP[last.k],bad:last.k==='fail'||(c.alert&&c.alert.type==='stale'&&dir==='in'),no:dir==='out'?c.outTrack:c.inTrack};
}
function trkPill(c){const t=trk(c);if(!t)return '';

function trkBlock(c,dir){const t=trk(c,dir);if(!t)return '';

function renderTrk(){

  <div class="tw"><table><thead><tr><th>접수 일시</th><th>접수 → 수거</th><th>방향</th><th>지금 상태</th><th>지금 위치</th><th>마지막 갱신</th><th>고객</th><th>송장번호</th><th>접수 건</th></tr></thead><tbody>
  ${rows.map(({c,t})=>`<tr><td class="n">${recvTxt(c)}</td><td>${pkPill(c)}</td><td>${t.dir==='in'?'회수':'출고'}</td><td><span class="trk ${t.bad?'bad':t.step===3?'ok':''}">${esc(t.last.x)}${t.bad&&t.last.k!=='fail'?' · 48시간 멈춤':''}</span></td><td>${esc(t.last.loc)}</td><td class="n">${esc(t.last.t)}</td><td>${esc(c.name)}</td><td class="n">${esc(t.no)}</td><td><button class="go" data-go="${c.id}">${c.id}</button></td></tr>`).join('')}</tbody></table></div></div>`;

/* 판정 */
function warranty(c){
  if(!c.buy) return {k:'paid',label:'구매일 확인 안 됨 → 유상 기준',fee:(FEE[c.fam]||[0,0])[1],tier:'확인 안 됨'};
  const y=(new Date(c.recv)-new Date(c.buy))/864e5/365;
  if(y<1) return {k:'free',label:'무상 (구매 후 1년 이내)',fee:0,tier:'1년 미만'};
  const f=FEE[c.fam]||[0,0]; const fee=y<2?f[0]:f[1];
  return {k:'paid',label:'유상 ('+(y<2?'1~2년':'2년 이후')+')',fee,tier:y<2?'1~2년':'2년 이후'};
}
const won=n=>n?n.toLocaleString('ko-KR')+'원':'0원';
function task(c){ // 지금 해야 할 일
  const s=ST[c.stage];
  if(c.alert){const a=ALERT[c.alert.type];return {todo:a.todo,own:a.own,red:1,wait:0}}
  return {todo:s.todo,own:s.own,red:!!s.red,wait:!!s.wait,end:!!s.end};
}

const GROUPS=[['judge','접수 확인·판정'],['pickup','수거 접수'],['alert','수거·입금 경고'],['inspect','개봉·검사'],['notify','고객 안내'],['ship','출고']];
function inGroup(c,g){ if(g==='alert') return !!c.alert; return c.stage===g && !c.alert }
function visible(){

  if(filt==='todo') v=v.filter(c=>{const t=task(c);return !t.wait&&!t.end});
  else if(filt==='wait') v=v.filter(c=>task(c).wait);

function msgFor(c){
  const w=warranty(c);
  if(c.stage==='judge'&&w.k==='paid'&&BLOCKED[c.fam]) return ['유상 AS 접수 불가 안내',TPL.blocked(c)];
  if(c.stage==='pickup'||(c.stage==='transit'&&!c.alert)) return ['수거 안내',TPL.pickup(c)];
  if(c.stage==='notify'||c.stage==='pay') return c.plan==='normal'?['정상작동 안내',TPL.normal(c)]:c.plan==='free'?['무상 교환 안내',TPL.free(c)]:['유상 비용 안내',TPL.paid(c,w.fee)];
  if(c.stage==='ship'||c.stage==='done') return ['출고 안내',TPL.out(c)];
  return null;
}

   case 'paid': c.alert=null;c.stage='ship';log(c,'입금 확인 '+won(w.fee));break;
   case 'nopay': c.alert=null;c.plan='return';c.stage='ship';log(c,'유상 진행 안 함 → 착불 반송');break;
   case 'shipDone': if(!val('f-out')) return toast('출고 송장번호를 넣어 주세요'); c.outTrack=val('f-out');c.stage='done';c.tout=[{t:stamp(),k:'book',x:'출고 접수',loc:'시흥 배곧'}];log(c,'출고 완료 · 송장 '+c.outTrack+' · 출고 안내 문자');break;
   case 'hold': c.alert=null;c.stage='hold';log(c,'보류로 옮김');break;
   case 'resume': c.stage='judge';log(c,'보류 해제');break;
   case 'close': c.stage='closed';log(c,'종결');break;
   case 'memo': if(!val('f-memo')) return; log(c,val('f-memo'));break;
   case 'copy': {const t=$('msgtxt').textContent;navigator.clipboard?.writeText(t).then(()=>toast('안내문을 복사했습니다'),()=>toast('복사가 막혀 있습니다. 글을 길게 눌러 복사해 주세요'));return}
  }
  toast('저장했습니다 → '+task(c).todo); refresh();
}

<tr><td>수거완료</td><td>개봉·검사 필요 → 고객 안내 필요</td><td>창고 → 상담</td></tr>
<tr><td>유상AS입금대기</td><td>입금 기다림 (3일 뒤 재안내 경고)</td><td>자동 → 상담</td></tr>
<tr><td>출고예정</td><td>출고·송장 입력</td><td>창고</td></tr>
<tr><td>처리완료 · 반품완료건 · 폐기</td><td>완료 (처리 방법: 교환·재발송·반품·보상판매·폐기)</td><td>-</td></tr>
<tr><td>보류</td><td>보류</td><td>상담</td></tr>
<tr><td>AS 비용 · 문자양식</td><td>설정 (판정 금액표, 안내문)</td><td>대표</td></tr></tbody></table></div></div>

<div><h2>자동으로 올라오는 표시</h2><ul>
<li>수거 실패 → 상담에게 '재수거 확인'</li><li>수거 후 48시간 이동 없음 → 상담에게 '배송 확인'</li>
<li>창고 도착 → 창고에게 '개봉·검사 필요' (빨강)</li><li>검사 결과 저장 → 김은진(상담)에게 '고객 안내 필요' (빨강). 기한은 창고 확인 시각부터 2영업일(주말 제외)이며 건마다 기한 날짜가 붙습니다</li>
<li>비용 안내 후 3일 입금 없음 → 상담에게 '입금 재안내'</li><li>담당자가 확인 버튼을 누른 표시만 꺼지고, 이력에 남습니다</li>
<li>도착은 택배 연동 정보로만 확정합니다. 날짜만으로 도착 처리하지 않습니다</li></ul></div>

<div><h2>수거 확정 뒤 물건 상태를 실시간으로 보는 방법</h2>
<p>물건 상태는 택배 기록과 창고 직원의 버튼 두 가지로 정해집니다. 화면에는 항상 '마지막 갱신 시각'을 같이 보여 줍니다.</p>
<div class="tw"><table><thead><tr><th>물건 상태</th><th>무엇으로 바뀌나</th><th>화면 표시</th></tr></thead><tbody>
<tr><td>고객 보관</td><td>수거 접수 (상담이 송장 등록)</td><td>접수 N일째 · 수거 전. 3일 넘으면 노란색</td></tr>
<tr><td>수거 완료 (수거 확정)</td><td>택배사 '집화' 기록이 들어온 시각</td><td>'접수 N일 만에 수거'가 이때 확정되어 건마다 남음</td></tr>
<tr><td>이동 중</td><td>택배 조회를 주기적으로 자동 확인 (제안: 1시간마다)</td><td>지금 위치(터미널 이름). 48시간 기록 없으면 빨간색</td></tr>
<tr><td>창고</td><td>택배 '배송 완료' 기록 → 이후는 창고·상담 버튼</td><td>검사 기다림 / 고객 안내 기다림 / 입금 기다림 / 출고 준비</td></tr>
<tr><td>출고·배송 중</td><td>출고 송장 등록 뒤 다시 자동 조회</td><td>지금 위치</td></tr>
<tr><td>고객 수령</td><td>택배 '배송 완료' 기록</td><td>접수부터 수령까지 걸린 일수</td></tr></tbody></table></div>
<ul><li>조회에 실패하면 상태를 바꾸지 않고, 총괄 화면에 연동 오류로 표시합니다.</li>
<li>수거·도착·수령 일수는 건마다 저장되어 나중에 채널별·기간별 평균을 낼 수 있습니다.</li></ul></div>

<div><h2>만드는 순서</h2><ol>
<li><b>공용 저장소와 이 업무판</b>: 직원이 같은 자료를 보고 버튼으로 넘기기. 접수는 손 입력과 붙여넣기.</li>
<li><b>기존 시트 시험 이관</b>: 원본은 그대로 두고 복사본에서 탭→상태로 옮겨 보고, 안 맞는 건 목록을 대표님께 보여드림.</li>
<li><b>접수폼 자동 수집 + AI 항목 분리</b></li>
<li><b>롯데택배 추적 연동</b>: 수거 실패·48시간·도착 자동 표시. 주말 계산은 실제 자료를 보며 정함.</li>
<li><b>문자 발송 연동, 자동 백업·복구 점검</b></li></ol></div>

<div><h2>대표님이 정해 주실 것</h2><ol>
<li>상담 담당은 <b>김은진</b> 님으로 반영했습니다. 창고 담당은 <b>최미영 실장</b>님으로 반영했습니다. 각 대체 담당자는 아직 정해지지 않았습니다.</li>
<li>듀얼 딥웨이브 유상 금액: 120,000원과 90,000원 중 어느 쪽인지 → 실무를 맡은 <b>김은진 님께 확인 필요</b> (확인 전까지 90,000원으로 계산)</li>
<li><b>결정됨:</b> 'as' 탭에서 2026년 6월 이전 접수 건(2026-05-31 접수분까지)은 모두 종결로 옮기고, 2026년 6월 1일 이후 접수 건만 진행 중으로 이관합니다. 원본 시트는 그대로 두고 시험 이관본에서만 적용합니다.</li>
<li><b>결정됨:</b> 고객 안내 기한은 날짜 고정이 아니라 <b>창고 담당자가 확인(검사 결과 입력)한 시각부터 2영업일 안</b>입니다. 건마다 기한 날짜를 표시하고, 지나면 빨갛게 표시합니다. (입금 재안내 3일, 배송 확인 48시간은 제안값이며 확인이 필요합니다.)</li>
<li><b>결정됨:</b> 현대홈쇼핑은 일반 AS와 섞지 않고 <b>별도의 큰 분류</b>로 처리합니다. '할 일' 맨 위에서 '일반 AS·교환·반품'과 '현대홈쇼핑'을 나눠 보고, 건수도 따로 셉니다. 현대홈쇼핑 전용 단계(회수요청 → 회수 → 입고·개봉 여부 확인 → 회수확정)는 지금은 일반 단계를 빌려 쓴 임시 상태이며 다음 수정에서 따로 설계합니다.</li>
<li>택배 자동 조회 주기(제안 1시간)와 수거 지연 기준(제안 접수 후 3일)</li></ol></div></div>`;

/* 화면 전환·이벤트 */
$('v-trk').onclick=e=>{const b=e.target.closest('[data-go]');if(!b)return;sel=b.dataset.go;q=sel;$('q').value=sel;show('todo')};
function show(v){['todo','trk','new','boss','plan'].forEach(k=>$('v-'+k).hidden=k!==v); if(v==='trk')renderTrk();
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));
  if(v==='boss')renderBoss(); if(v==='todo')refresh()}
$('tabs').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.v)};
$('strip').onclick=e=>{const b=e.target.closest('button');if(!b)return;filt=b.dataset.f;q='';$('q').value='';refresh()};
$('catSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;cat=b.dataset.c;filt='todo';q='';$('q').value='';sel=null;show('todo')};
$('ownerSeg').onclick=e=>{const b=e.target.closest('button');if(!b)return;owner=b.dataset.o;document.querySelectorAll('#ownerSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b));refresh()};
$('q').oninput=e=>{q=e.target.value.trim();renderStrip();renderList()};
$('list').onclick=e=>{const r=e.target.closest('.row');if(!r)return;sel=r.dataset.id;dtab='do';refresh()};
$('detail').onclick=e=>{const t=e.target.closest('[data-dt]');if(t){dtab=t.dataset.dt;return renderDetail()}const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b)};
renderNew(); refresh();
if(window.matchMedia('(min-width:901px)').matches){sel=visible()[0]?.id||null;refresh()}
</script>
